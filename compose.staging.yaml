# App service — staging environment override
# Builds prod targets; HTTP only on digidex-staging-net; routes on port 10001.

name: app-service

secrets:
  jwt_public_key:
    file: ../secrets/public_key.pem

services:
  app-frontend:
    container_name: app-frontend-staging
    build:
      context: ..
      dockerfile: app/frontend/Dockerfile
      target: prod
    networks:
      - digidex-staging-net
    depends_on:
      - app-backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-frontend-staging.rule=Host(`10.0.0.218`) && PathPrefix(`/app`)"
      - "traefik.http.routers.app-frontend-staging.priority=100"
      - "traefik.http.routers.app-frontend-staging.entrypoints=web"
      - "traefik.http.routers.app-frontend-staging.tls=false"
      - "traefik.http.routers.app-frontend-staging.tls.certresolver="
      - "traefik.http.services.app-frontend-staging.loadbalancer.server.port=3001"
      - "traefik.docker.network=digidex-staging-net"

  app-backend:
    container_name: app-backend-staging
    build:
      context: ./backend/
      dockerfile: Dockerfile
      target: prod
    networks:
      - digidex-staging-net
    secrets:
      - jwt_public_key
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.staging
        required: true   # Copy from .env.staging.example before first deploy
    environment:
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-backend-staging.rule=Host(`10.0.0.218`) && PathPrefix(`/app/api`)"
      - "traefik.http.routers.app-backend-staging.priority=200"
      - "traefik.http.routers.app-backend-staging.entrypoints=web"
      - "traefik.http.routers.app-backend-staging.tls=false"
      - "traefik.http.routers.app-backend-staging.tls.certresolver="
      - "traefik.http.services.app-backend-staging.loadbalancer.server.port=8003"
      - "traefik.docker.network=digidex-staging-net"

networks:
  digidex-staging-net:
    external: true
